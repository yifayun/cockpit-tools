name: 🪟 Build Windows

on:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: "🏗️ Build Windows x64"
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: windows

      - name: 🐹 Go setup
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install frontend dependencies
        run: npm install

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🔐 Check signing availability
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏗️ Build app (Unsigned CI)
        if: steps.signing.outputs.available != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json 2>&1 | tee build-windows-latest.log

      - name: 🏗️ Build app (Signed)
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri build --ci 2>&1 | tee build-windows-latest.log

      - name: 📜 Print build logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== BUILD LOG ==="
          if [ -f build-windows-latest.log ]; then
            tail -n 200 build-windows-latest.log
          else
            echo "Log file not found"
          fi

      - name: 📤 Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-latest
          retention-days: 7
          if-no-files-found: warn
          path: build-windows-latest.log

      - name: 📤 Upload build bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows-latest
          retention-days: 7
          if-no-files-found: error
          path: target/release/bundle
